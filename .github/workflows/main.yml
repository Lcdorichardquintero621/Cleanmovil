name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir proyecto
        run: |
          unzip -o CleanMovil.zip -d proyecto
          S=$(find proyecto -name settings.gradle | head -1)
          if [ -z "$S" ]; then echo "No encontré settings.gradle"; unzip -l CleanMovil.zip; exit 1; fi
          echo "PROJ=$(dirname "$S")" >> $GITHUB_ENV
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
      - run: gradle assembleDebug
        working-directory: ${{ env.PROJ }}
      - uses: actions/upload-artifact@v4
        with:
          name: Cleanmovil-APK
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/app-debug.apk
